<style>
:root {
  --surface-base: #0a0e17;
  --surface-panel: #131b2e;
  --surface-accent: #1d2942;
  --neon-cyan: #00f2fe;
  --neon-purple: #9d4edd;
  --neon-glow: rgba(0, 242, 254, 0.25);
  --text-main: #e2e8f0;
  --text-dim: #94a3b8;
  --border-line: #2d3748;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background-color: var(--surface-base);
  color: var(--text-main);
  line-height: 1.6;
}

/* Navbar */
.top-bar {
  background: rgba(19, 27, 46, 0.85);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border-line);
  padding: 14px 24px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.top-bar-inner {
  max-width: 1100px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo-box {
  font-size: 22px;
  font-weight: 900;
  color: #fff;
  text-decoration: none;
  background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.status-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(0, 242, 254, 0.08);
  border: 1px solid var(--neon-cyan);
  color: var(--neon-cyan);
  padding: 5px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
}

.pulse-dot {
  width: 8px;
  height: 8px;
  background-color: var(--neon-cyan);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--neon-cyan);
  animation: pulse-glow 1.5s infinite;
}

/* Hero Header */
.hero-banner {
  max-width: 1100px;
  margin: 30px auto 20px auto;
  padding: 30px 20px;
  background: linear-gradient(135deg, var(--surface-panel), var(--surface-accent));
  border-radius: 16px;
  border: 1px solid var(--border-line);
  text-align: center;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}

.hero-banner h1 {
  font-size: 28px;
  color: #fff;
  margin-bottom: 8px;
}

.hero-banner p {
  color: var(--text-dim);
  font-size: 15px;
}

/* Grid الحلقات */
.container {
  max-width: 1100px;
  margin: 0 auto 40px auto;
  padding: 0 16px;
}

.episodes-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 18px;
  margin-top: 20px;
}

.ep-card {
  background: var(--surface-panel);
  border: 1px solid var(--border-line);
  border-radius: 12px;
  padding: 16px;
  text-decoration: none;
  color: var(--text-main);
  transition: all 0.25s ease;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.ep-card:hover {
  transform: translateY(-4px);
  border-color: var(--neon-cyan);
  box-shadow: 0 8px 25px var(--neon-glow);
}

.ep-badge {
  background: rgba(0, 242, 254, 0.1);
  color: var(--neon-cyan);
  font-size: 11px;
  font-weight: 800;
  padding: 3px 8px;
  border-radius: 4px;
  width: fit-content;
  margin-bottom: 10px;
}

.ep-title {
  font-size: 16px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 12px;
}

.ep-btn {
  background: var(--surface-accent);
  color: #fff;
  text-align: center;
  padding: 8px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
}

.ep-card:hover .ep-btn {
  background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
}

@keyframes pulse-glow {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.85); }
}
</style>
</head>
<body>

<div class="top-bar">
  <div class="top-bar-inner">
    <a href="https://hob-ala-waraq.github.io/" class="logo-box">حب على ورق HD</a>
    <div class="status-pill">
      <span class="pulse-dot"></span>

    </div>
  </div>
</div>

<div class="hero-banner">
  <h1>مسلسل حب على ورق</h1>
  <p>اختر الحلقة للمشاهدة المباشرة بدقة عالية وبدون إعلانات مزعجة</p>
</div>

<div class="container">
  <div class="episodes-grid">
    <!-- حلقة 45 -->
    <a href="https://hob-ala-waraq.github.io/m/ep45/" class="ep-card">
      <div>
        <span class="ep-badge">الأحدث 🔥</span>
        <div class="ep-title">الحلقة 45 الخامسة والأربعون</div>
      </div>
      <div class="ep-btn">شاهد الآن ◀</div>
    </a>

    <!-- حلقة 44 -->
    <a href="https://hob-ala-waraq.github.io/m/ep44/" class="ep-card">
      <div>
        <span class="ep-badge">HD</span>
        <div class="ep-title">الحلقة 44 الرابعة والأربعون</div>
      </div>
      <div class="ep-btn">شاهد الآن ◀</div>
    </a>

    <!-- حلقة 43 -->
    <a href="https://hob-ala-waraq.github.io/m/ep43/" class="ep-card">
      <div>
        <span class="ep-badge">HD</span>
        <div class="ep-title">الحلقة 43 الثالثة والأربعون</div>
      </div>
      <div class="ep-btn">شاهد الآن ◀</div>
    </a>
  </div>
</div>

</body>
</html>
